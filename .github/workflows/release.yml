name: Windows release

on:
  push:
    branches: [main]
    paths: ["src/main.go"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          Invoke-WebRequest -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') {
            throw 'NSIS archive checksum mismatch.'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
      - name: Test and build Windows packages
        shell: pwsh
        run: ./installer/build.ps1 -OutputDirectory ./dist -MakeNSIS "$env:RUNNER_TEMP/nsis-3.11/makensis.exe"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $main = Get-Content src/main.go -Raw
          if ($main -notmatch '(?m)^const version = "([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing stable version.' }
          $version = $Matches[1]
          $tag = "v$version"
          $null = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists"
            exit 0
          }
          gh release create $tag "dist/Spherelay-$version-Windows-x64.exe" "dist/Spherelay-$version-Windows-x64-Setup.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Spherelay $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
