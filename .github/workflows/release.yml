name: Windows release

on:
  push:
    branches: [main]
    paths: ["src/main.go", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $hash = 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1'
          foreach ($mirror in 'netix.dl.sourceforge.net','phoenixnap.dl.sourceforge.net','pilotfiber.dl.sourceforge.net') {
            curl.exe --fail --silent --show-error --location --max-time 20 "https://$mirror/project/nsis/NSIS%203/3.11/nsis-3.11.zip" --output $archive
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $archive).Hash -eq $hash) {
              Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
              "NSIS_COMPILER=$env:RUNNER_TEMP/nsis-3.11/makensis.exe" >> $env:GITHUB_ENV
              exit 0
            }
          }
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain a verified NSIS compiler.' }
          "NSIS_COMPILER=${env:ProgramFiles(x86)}/NSIS/makensis.exe" >> $env:GITHUB_ENV
      - name: Test and build Windows packages
        shell: pwsh
        run: ./installer/build.ps1 -OutputDirectory ./dist -MakeNSIS "$env:NSIS_COMPILER"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $main = Get-Content src/main.go -Raw
          if ($main -notmatch '(?m)^const version = "([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing stable version.' }
          $version = $Matches[1]
          $tag = "v$version"
          $null = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists"
            exit 0
          }
          gh release create $tag "dist/Spherelay-$version-Windows-x64.exe" "dist/Spherelay-$version-Windows-x64-Setup.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Spherelay $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
